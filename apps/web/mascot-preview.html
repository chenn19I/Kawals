<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mascot preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #12102b; }
      #root { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; }
      .cell { position: relative; width: 100%; height: 100%; }
      .cell span { position: absolute; left: 12px; top: 10px; color: #cfd6ff; font: 12px monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mascot-preview.tsx"></script>
  </body>
</html>
